<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빅데이터 퀴즈</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1c2330;
    --muted: #667085;
    --line: #dde2ea;
    --accent: #2f5fd0;
    --accent-text: #ffffff;
    --ok: #17804a;
    --ok-bg: #e5f5ec;
    --no: #c2362b;
    --no-bg: #fdeceA;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --card: #1c212b;
      --text: #e8ecf3;
      --muted: #98a2b3;
      --line: #313846;
      --accent: #6d93f2;
      --accent-text: #0e1320;
      --ok: #5fd39a;
      --ok-bg: #173526;
      --no: #ff8f85;
      --no-bg: #3d1d1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  header h1 { font-size: 1.35rem; margin: 0 0 4px; }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .top {
    display: flex;
    justify-content: space-between;
    font-size: 0.88rem;
    color: var(--muted);
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .question { font-size: 1.08rem; font-weight: 600; margin: 0 0 16px; word-break: keep-all; }
  .choices { display: grid; gap: 10px; }
  .choice {
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
    min-height: 50px;
    cursor: pointer;
    word-break: keep-all;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: var(--ok); background: var(--ok-bg); }
  .choice.wrong { border-color: var(--no); background: var(--no-bg); }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; }
  .feedback.ok { background: var(--ok-bg); }
  .feedback.no { background: var(--no-bg); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.no strong { color: var(--no); }
  .primary {
    display: block;
    width: 100%;
    margin-top: 16px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
  }
  .score { text-align: center; margin: 4px 0 6px; }
  .score b { font-size: 3rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .score span { color: var(--muted); font-size: 1.2rem; }
  .verdict { text-align: center; margin: 0 0 4px; font-weight: 600; }
  .review { list-style: none; margin: 20px 0 0; padding: 0; }
  .review li { border-top: 1px solid var(--line); padding: 14px 0; font-size: 0.94rem; }
  .review .mark { font-weight: 700; margin-right: 6px; }
  .review .mark.ok { color: var(--ok); }
  .review .mark.no { color: var(--no); }
  .review p { margin: 4px 0 0; color: var(--muted); }
  .review p.ans { color: var(--text); }
  #lock label { display: block; }
  #password {
    width: 100%;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
  }
  #password:focus { outline: none; border-color: var(--accent); }
  .lock-msg { margin: 10px 0 0; color: var(--no); font-size: 0.92rem; }
  .primary:disabled { opacity: .6; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>빅데이터 퀴즈</h1>
    <p>문제 은행에서 10문제가 무작위로 출제됩니다.</p>
  </header>

  <form class="card" id="lock">
    <label class="question" for="password">비밀번호를 입력하세요</label>
    <input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <p class="lock-msg" id="lockMsg" hidden></p>
    <button class="primary" id="unlock" type="submit">시작하기</button>
  </form>

  <section class="card" id="quiz" hidden>
    <div class="top"><span id="count"></span><span id="running"></span></div>
    <div class="bar"><div id="progress"></div></div>
    <p class="question" id="question"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" hidden></div>
    <button class="primary" id="next" hidden></button>
  </section>

  <section class="card" id="result" hidden>
    <p class="score"><b id="scoreNum"></b><span> / 10</span></p>
    <p class="verdict" id="verdict"></p>
    <button class="primary" id="restart">다시하기 (새로운 10문제)</button>
    <ul class="review" id="review"></ul>
  </section>
</main>

<script src="data.js"></script>
<script>
let BANK = null;

const QUIZ_SIZE = 10;
const $ = id => document.getElementById(id);

let questions, index, score, answers;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  questions = shuffle(BANK).slice(0, QUIZ_SIZE).map(item => (
    { q: item.q, e: item.e, choices: shuffle(item.c), answer: item.c[0] }
  ));
  index = 0;
  score = 0;
  answers = [];
  $("result").hidden = true;
  $("quiz").hidden = false;
  show();
}

function show() {
  const item = questions[index];
  $("count").textContent = `문제 ${index + 1} / ${QUIZ_SIZE}`;
  $("running").textContent = `정답 ${score}개`;
  $("progress").style.width = `${(index / QUIZ_SIZE) * 100}%`;
  $("question").textContent = item.q;
  $("feedback").hidden = true;
  $("next").hidden = true;

  $("choices").replaceChildren(...item.choices.map(text => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = text;
    btn.addEventListener("click", () => pick(btn, text));
    return btn;
  }));
}

function pick(btn, text) {
  const item = questions[index];
  const correct = text === item.answer;
  if (correct) score++;
  answers.push({ item, picked: text, correct });

  for (const b of $("choices").children) {
    b.disabled = true;
    if (b.textContent === item.answer) b.classList.add("correct");
  }
  if (!correct) btn.classList.add("wrong");

  const fb = $("feedback");
  fb.className = "feedback " + (correct ? "ok" : "no");
  fb.replaceChildren();
  const head = document.createElement("strong");
  head.textContent = correct ? "정답입니다" : `오답입니다 · 정답: ${item.answer}`;
  fb.append(head, item.e);
  fb.hidden = false;

  $("running").textContent = `정답 ${score}개`;
  $("progress").style.width = `${((index + 1) / QUIZ_SIZE) * 100}%`;
  const next = $("next");
  next.textContent = index + 1 < QUIZ_SIZE ? "다음 문제" : "결과 보기";
  next.hidden = false;
  next.focus();
}

function finish() {
  $("quiz").hidden = true;
  $("scoreNum").textContent = score;
  $("verdict").textContent = `${QUIZ_SIZE}문제 중 ${score}문제를 맞혔습니다.`;
  $("review").replaceChildren(...answers.map((a, i) => {
    const li = document.createElement("li");
    const mark = document.createElement("span");
    mark.className = "mark " + (a.correct ? "ok" : "no");
    mark.textContent = a.correct ? "O" : "X";
    li.append(mark, `${i + 1}. ${a.item.q}`);
    const ans = document.createElement("p");
    ans.className = "ans";
    ans.textContent = a.correct ? `정답: ${a.item.answer}` : `내 답: ${a.picked} / 정답: ${a.item.answer}`;
    const exp = document.createElement("p");
    exp.textContent = a.item.e;
    li.append(ans, exp);
    return li;
  }));
  $("result").hidden = false;
  window.scrollTo(0, 0);
}

$("next").addEventListener("click", () => {
  index++;
  if (index < QUIZ_SIZE) show(); else finish();
});
$("restart").addEventListener("click", start);

// 문제 은행은 data.js에 암호화되어 있고, 비밀번호로만 풀린다
async function decryptBank(password) {
  const d = window.QUIZ_DATA;
  const bytes = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  const pw = new TextEncoder().encode(password.trim().normalize("NFC"));
  const base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-512", salt: bytes(d.salt), iterations: d.iter }, base, 512));
  const iv = bytes(d.iv), ct = bytes(d.ct);
  const signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv);
  signed.set(ct, iv.length);
  const macKey = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  if (!await crypto.subtle.verify("HMAC", macKey, bytes(d.mac), signed)) return null;
  const encKey = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv }, encKey, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}

$("lock").addEventListener("submit", async ev => {
  ev.preventDefault();
  const msg = $("lockMsg"), btn = $("unlock");
  msg.hidden = true;
  btn.disabled = true;
  btn.textContent = "확인 중…";
  let bank = null, failed = false;
  try {
    bank = await decryptBank($("password").value);
  } catch (err) {
    failed = true;
  }
  btn.disabled = false;
  btn.textContent = "시작하기";
  if (!bank) {
    msg.textContent = failed || !window.QUIZ_DATA
      ? "문제를 불러오지 못했습니다. 잠시 후 새로고침해 주세요."
      : "비밀번호가 맞지 않습니다.";
    msg.hidden = false;
    $("password").select();
    return;
  }
  BANK = bank;
  $("lock").hidden = true;
  start();
});
$("password").focus();
</script>
</body>
</html>
