<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빅데이터 퀴즈</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1c2330;
    --muted: #667085;
    --line: #dde2ea;
    --accent: #2f5fd0;
    --accent-text: #ffffff;
    --ok: #17804a;
    --ok-bg: #e5f5ec;
    --no: #c2362b;
    --no-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --card: #1c212b;
      --text: #e8ecf3;
      --muted: #98a2b3;
      --line: #313846;
      --accent: #6d93f2;
      --accent-text: #0e1320;
      --ok: #5fd39a;
      --ok-bg: #173526;
      --no: #ff8f85;
      --no-bg: #3d1d1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  header h1 { font-size: 1.35rem; margin: 0 0 4px; }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .top {
    display: flex;
    justify-content: space-between;
    font-size: 0.88rem;
    color: var(--muted);
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .question { font-size: 1.08rem; font-weight: 600; margin: 0 0 16px; word-break: keep-all; }
  .choices { display: grid; gap: 10px; }
  .choice {
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
    min-height: 50px;
    cursor: pointer;
    word-break: keep-all;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:disabled { cursor: default; }
  .choice.picked { border-color: var(--accent); }
  .choice.correct { border-color: var(--ok); background: var(--ok-bg); }
  .choice.wrong { border-color: var(--no); background: var(--no-bg); }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; }
  .feedback.wait { color: var(--muted); padding-left: 0; }
  .feedback.ok { background: var(--ok-bg); }
  .feedback.no { background: var(--no-bg); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.no strong { color: var(--no); }
  .primary {
    display: block;
    width: 100%;
    margin-top: 16px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
  }
  .primary:disabled { opacity: .6; cursor: default; }
  .score { text-align: center; margin: 4px 0 6px; }
  .score b { font-size: 3rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .score span { color: var(--muted); font-size: 1.2rem; }
  .verdict { text-align: center; margin: 0 0 4px; font-weight: 600; }
  .review { list-style: none; margin: 20px 0 0; padding: 0; }
  .review li { border-top: 1px solid var(--line); padding: 14px 0; font-size: 0.94rem; }
  .review .mark { font-weight: 700; margin-right: 6px; }
  .review .mark.ok { color: var(--ok); }
  .review .mark.no { color: var(--no); }
  .review p { margin: 4px 0 0; color: var(--muted); }
  .review p.ans { color: var(--text); }
  #lock label { display: block; }
  #password {
    width: 100%;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
  }
  #password:focus { outline: none; border-color: var(--accent); }
  .msg { margin: 10px 0 0; color: var(--no); font-size: 0.92rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>빅데이터 퀴즈</h1>
    <p>문제 은행에서 10문제가 무작위로 출제됩니다.</p>
  </header>

  <form class="card" id="lock">
    <label class="question" for="password">비밀번호를 입력하세요</label>
    <input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <p class="msg" id="lockMsg" hidden></p>
    <button class="primary" id="unlock" type="submit">시작하기</button>
  </form>

  <section class="card" id="quiz" hidden>
    <div class="top"><span id="count"></span><span id="running"></span></div>
    <div class="bar"><div id="progress"></div></div>
    <p class="question" id="question"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" hidden></div>
    <button class="primary" id="next" hidden></button>
  </section>

  <section class="card" id="result" hidden>
    <p class="score"><b id="scoreNum"></b><span id="scoreTotal"></span></p>
    <p class="verdict" id="verdict"></p>
    <button class="primary" id="restart">다시하기 (새로운 10문제)</button>
    <p class="msg" id="restartMsg" hidden></p>
    <ul class="review" id="review"></ul>
  </section>
</main>

<script>
// 문제 출제와 채점은 구글 Apps Script 서버가 한다. 이 페이지에는 문제와 정답이 없다.
const API_URL = "https://script.google.com/macros/s/AKfycbxUzeC9Artx9TIhc-XCL2lEYyAxMasMf0yiXmlyDOlkDnBtFWqWSjVQoDT0OTqYhOo-/exec";
const $ = id => document.getElementById(id);

let password = "", token, questions, index, score, answers;

async function api(body) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...body, password })
  });
  return res.json();
}

// 새 10문제를 받아 온다. 실패하면 사용자에게 보여 줄 문구를 돌려준다.
async function load() {
  let res;
  try {
    res = await api({ action: "start" });
  } catch (err) {
    return "서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }
  if (res.error === "password") return "비밀번호가 맞지 않습니다.";
  if (res.error || !res.questions || !res.questions.length) return "문제를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
  token = res.token;
  questions = res.questions;
  index = 0;
  score = 0;
  answers = [];
  $("lock").hidden = true;
  $("result").hidden = true;
  $("quiz").hidden = false;
  show();
  return null;
}

function show() {
  const item = questions[index];
  $("count").textContent = `문제 ${index + 1} / ${questions.length}`;
  $("running").textContent = `정답 ${score}개`;
  $("progress").style.width = `${(index / questions.length) * 100}%`;
  $("question").textContent = item.q;
  $("feedback").hidden = true;
  $("next").hidden = true;
  $("choices").replaceChildren(...item.choices.map(text => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = text;
    btn.addEventListener("click", () => pick(btn, text));
    return btn;
  }));
}

async function pick(btn, text) {
  const item = questions[index];
  const buttons = [...$("choices").children];
  const fb = $("feedback");
  buttons.forEach(b => b.disabled = true);
  btn.classList.add("picked");
  fb.className = "feedback wait";
  fb.textContent = "채점 중…";
  fb.hidden = false;

  let res = null;
  try {
    res = await api({ action: "answer", token, id: item.id, choice: text });
  } catch (err) {}
  if (!res || res.error) {
    fb.className = "feedback no";
    fb.textContent = res && res.error === "expired"
      ? "시간이 오래 지나 이어서 풀 수 없습니다. 페이지를 새로고침해 주세요."
      : "채점하지 못했습니다. 답을 다시 눌러 주세요.";
    btn.classList.remove("picked");
    buttons.forEach(b => b.disabled = false);
    return;
  }

  if (res.correct) score++;
  answers.push({ q: item.q, picked: text, correct: res.correct, answer: res.answer, e: res.e });
  btn.classList.remove("picked");
  buttons.forEach(b => { if (b.textContent === res.answer) b.classList.add("correct"); });
  if (!res.correct) btn.classList.add("wrong");

  fb.className = "feedback " + (res.correct ? "ok" : "no");
  fb.replaceChildren();
  const head = document.createElement("strong");
  head.textContent = res.correct ? "정답입니다" : `오답입니다 · 정답: ${res.answer}`;
  fb.append(head, res.e);

  $("running").textContent = `정답 ${score}개`;
  $("progress").style.width = `${((index + 1) / questions.length) * 100}%`;
  const next = $("next");
  next.textContent = index + 1 < questions.length ? "다음 문제" : "결과 보기";
  next.hidden = false;
  next.focus();
}

function finish() {
  $("quiz").hidden = true;
  $("scoreNum").textContent = score;
  $("scoreTotal").textContent = ` / ${questions.length}`;
  $("verdict").textContent = `${questions.length}문제 중 ${score}문제를 맞혔습니다.`;
  $("restartMsg").hidden = true;
  $("review").replaceChildren(...answers.map((a, i) => {
    const li = document.createElement("li");
    const mark = document.createElement("span");
    mark.className = "mark " + (a.correct ? "ok" : "no");
    mark.textContent = a.correct ? "O" : "X";
    li.append(mark, `${i + 1}. ${a.q}`);
    const ans = document.createElement("p");
    ans.className = "ans";
    ans.textContent = a.correct ? `정답: ${a.answer}` : `내 답: ${a.picked} / 정답: ${a.answer}`;
    const exp = document.createElement("p");
    exp.textContent = a.e;
    li.append(ans, exp);
    return li;
  }));
  $("result").hidden = false;
  window.scrollTo(0, 0);
}

// 버튼을 잠그고 새 문제를 불러온 뒤, 실패 문구가 있으면 msg에 보여 준다
async function loadWith(btn, msg, busyText) {
  const label = btn.textContent;
  msg.hidden = true;
  btn.disabled = true;
  btn.textContent = busyText;
  const error = await load();
  btn.disabled = false;
  btn.textContent = label;
  if (error) {
    msg.textContent = error;
    msg.hidden = false;
  }
  return !error;
}

$("next").addEventListener("click", () => {
  index++;
  if (index < questions.length) show(); else finish();
});
$("restart").addEventListener("click", () => loadWith($("restart"), $("restartMsg"), "불러오는 중…"));
$("lock").addEventListener("submit", async ev => {
  ev.preventDefault();
  password = $("password").value.trim();
  if (!await loadWith($("unlock"), $("lockMsg"), "확인 중…")) $("password").select();
});
$("password").focus();
</script>
</body>
</html>
